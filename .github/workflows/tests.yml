name: tests
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      - run: pytest -q
  javascript:
    # The website's JavaScript solver must give the same optimum as the Python package:
    # tests/js/cases.json holds networks with optima computed in Python (tests/js/make_cases.py).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/js/test_cpp.mjs
      - run: node tests/js/test_networks.mjs
      - run: node tests/js/test_extensions.mjs
      - run: node tests/js/test_matching.mjs
